name: Build Flutter Desktop

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows Release
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          Compress-Archive -Path "$rel/*" -DestinationPath "../ImageToPDF-Windows.zip" -Force
        working-directory: app

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageToPDF-Windows
          path: ImageToPDF-Windows.zip

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/ImageToPDF-Mac.zip" image_to_pdf.app

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageToPDF-Mac
          path: ImageToPDF-Mac.zip

  create-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ImageToPDF-Windows
          path: windows-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ImageToPDF-Mac
          path: macos-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-artifacts/ImageToPDF-Windows.zip
            macos-artifacts/ImageToPDF-Mac.zip
          body: |
            ## 图片转 PDF（Flutter 桌面版） ${{ github.ref_name }}

            ### 下载
            - Windows：使用 `ImageToPDF-Windows.zip`
            - macOS：使用 `ImageToPDF-Mac.zip`（解压后打开 `image_to_pdf.app`）

            ### 使用
            1. 运行应用
            2. 多次点击「添加图片」加入不同文件夹中的文件
            3. 拖拽排序后点击「导出 PDF」

            详细说明见仓库 `USAGE.md`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
